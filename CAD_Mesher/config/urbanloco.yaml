cad_mesher:
  #read param
  use_sim_time: true
  use_odom_prior: true 
  dataset: 4 # Means using UrbanLoco dataset
  max_steps: 10000
  save_mesh_map: true
  #register param
  range_max: 80.0
  range_min: 3.0
  register_times: 5
  cross_overlap: true
  cross_cell_overlap_length: 2
  num_margin_old_cell: -1
  point2mesh: true
  residual_combination: true
  #visualize parameter
  full_cover: true
  visualisation_type: 3
  #gp param
  num_thread: 15
  grid: 1.5 #1.8
  min_points_num_to_gp: 10
  num_test: 10 #6
  
  variance_register: 0.60
  variance_map_update: 0.50
  variance_map_show: 0.30
  variance_min: 1.36
  variance_sensor: 0.02
  
  test_param:  0
  
  sliding_window_size: 8
  scan_number: 32
  use_adaptive_kd: true
  use_curvature: true
  use_curvature_weight: false
  use_global_ground_contraint: true
  use_local_ground_contraint: false
  skip_map_glb_pub: 5
  ground_number_threshold: 10
  use_dynamic_removal: true
  stable_threshold: 0.97
  p_hit: 0.7
  p_miss: 0.4





